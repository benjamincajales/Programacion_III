<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - UTN</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro</h1>
        <p>Por favor, complete sus datos para registrarse en la plataforma.</p>
    </header>

    <main>
        <form action="#" method="POST">

            <!-- 1. Nombre completo -->
            <div>
                <label for="nombre">Nombre completo:</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    required 
                    placeholder="Ej: Juan Pérez"
                    tabindex="1"
                >
            </div>
            <br>

            <!-- 2. Correo electrónico -->
            <div>
                <label for="email">Correo electrónico:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="Ej: correo@ejemplo.com"
                    tabindex="2"
                >
            </div>
            <br>

            <!-- 3. Contraseña -->
            <div>
                <label for="password">Contraseña:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="Mínimo 8 caracteres"
                    tabindex="3"
                >
            </div>
            <br>

            <!-- 4. Selección de género (Radio buttons) -->
            <fieldset>
                <legend>Género:</legend>
                
                <input type="radio" id="genero-masculino" name="genero" value="masculino" tabindex="4">
                <label for="genero-masculino">Masculino</label>

                <input type="radio" id="genero-femenino" name="genero" value="femenino" tabindex="5">
                <label for="genero-femenino">Femenino</label>

                <input type="radio" id="genero-otro" name="genero" value="otro" tabindex="6">
                <label for="genero-otro">Otro</label>
            </fieldset>
            <br>

            <!-- 5. Intereses (Checkboxes) -->
            <fieldset>
                <legend>Intereses:</legend>

                <input type="checkbox" id="interes-musica" name="intereses" value="musica" tabindex="7">
                <label for="interes-musica">Música</label>

                <input type="checkbox" id="interes-deporte" name="intereses" value="deporte" tabindex="8">
                <label for="interes-deporte">Deporte</label>

                <input type="checkbox" id="interes-lectura" name="intereses" value="lectura" tabindex="9">
                <label for="interes-lectura">Lectura</label>

                <input type="checkbox" id="interes-programacion" name="intereses" value="programacion" tabindex="10">
                <label for="interes-programacion">Programación</label>
            </fieldset>
            <br>

            <!-- 7. País (Select) -->
            <div>
                <label for="pais">País de residencia:</label>
                <select id="pais" name="pais" required tabindex="11">
                    <option value="" disabled selected>Seleccione un país...</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>
            <br>

            <!-- 6. Comentarios adicionales (Textarea) -->
            <div>
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea 
                    id="comentarios" 
                    name="comentarios" 
                    rows="4" 
                    cols="40" 
                    placeholder="Escriba aquí sus comentarios u observaciones..."
                    tabindex="12"
                ></textarea>
            </div>
            <br>

            <!-- 8. Botón de envío -->
            <div>
                <input type="submit" value="Enviar Registro" tabindex="13">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - UTN Programación III</p>
    </footer>

</body>
</html>
